name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Includes the replay of the recorded zarr-python fixtures.
      - run: go test -race ./...
      - run: GOOS=js GOARCH=wasm go build ./...
      - run: GOOS=wasip1 GOARCH=wasm go build ./...

  consistency:
    # Live comparison with zarr-python (see consistency/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -r consistency/requirements.txt
      - run: ZARR_PYTHON=.venv/bin/python go test ./consistency/ -zarr.cases=300 -v 2>&1 | tail -40
        shell: bash
